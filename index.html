
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kozelka Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
      text-align: center;
      background: #f5f5f5;
    }
    h2 { color: #222; }
    #reader {
      width: 100%;
      margin: 20px auto;
      background: white;
    }
    button {
      padding: 14px 20px;
      margin: 8px;
      border: 0;
      border-radius: 6px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      font-size: 18px;
      margin-top: 12px;
    }
    #status {
      margin: 18px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Kozelka Barcode Scanner</h2>
  <p>Point your camera at the item's barcode.</p>

  <div id="reader"></div>

  <button id="startButton" onclick="startScanner()">Start Camera</button>
  <button id="stopButton" onclick="stopScanner()">Stop Camera</button>

  <div id="status">Ready to scan.</div>

  <p>If scanning doesn't work, enter the barcode manually:</p>
  <input id="manualCode" type="text" placeholder="Enter barcode number">
  <button onclick="sendManualCode()">Send Barcode</button>

  <script>
    let scanner = null;
    let scanComplete = false;

    async function startScanner() {
      try {
        document.getElementById("status").textContent =
          "Starting camera...";

        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        scanComplete = false;

        await scanner.start(
          { facingMode: "environment" },
          {
  fps: 15,
  qrbox: { width: 320, height: 200 },
  aspectRatio: 1.5,
  formatsToSupport: [
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF
  ]
},
          function(decodedText) {
            if (scanComplete) return;
            scanComplete = true;
            sendBarcode(decodedText);
          },
          function() {}
        );

        document.getElementById("status").textContent =
          "Camera is on. Scan a barcode.";

      } catch (error) {
        document.getElementById("status").textContent =
          "Camera could not start. Check browser permissions and try again.";
        console.error(error);
      }
    }

    async function stopScanner() {
      if (scanner && scanner.isScanning) {
        try {
          await scanner.stop();
          document.getElementById("status").textContent =
            "Camera stopped.";
        } catch (error) {
          console.error(error);
        }
      }
    }

    async function sendBarcode(code) {
      await stopScanner();

      document.getElementById("manualCode").value = code;
      document.getElementById("status").textContent =
        "Barcode scanned: " + code;

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          {
            type: "KOZELKA_BARCODE",
            code: code
          },
          "*"
        );

        document.getElementById("status").textContent =
          "Barcode sent! You can return to your inventory app.";
      } else {
        document.getElementById("status").textContent =
          "Barcode scanned. Return to your inventory app and enter the number manually.";
      }
    }

    function sendManualCode() {
      const code = document.getElementById("manualCode").value.trim();

      if (!code) {
        document.getElementById("status").textContent =
          "Please enter a barcode first.";
        return;
      }

      sendBarcode(code);
    }
  </script>
</body>
</html>
